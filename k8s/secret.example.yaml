# TEMPLATE ONLY - do not put real values in this file and do not commit them.
# This file is deliberately NOT listed in kustomization.yaml, so
# `kubectl apply -k k8s` never overwrites the real secret with placeholders.
#
# Create the real secret once (and again whenever a value changes):
#
#   kubectl -n webapps-mangrove-guard create secret generic mangrove-guard-secret \
#     --from-literal=MONGO_URI='mongodb://<user>:<password>@192.168.222.59:27017/mangroveguard?authSource=admin' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=EMAIL_USER='' \
#     --from-literal=EMAIL_PASS='' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# URL-encode special characters in the Mongo password (@ : / ? # etc.).
# Changing JWT_SECRET logs every user out.
apiVersion: v1
kind: Secret
metadata:
  name: mangrove-guard-secret
  namespace: webapps-mangrove-guard
type: Opaque
stringData:
  MONGO_URI: "mongodb://CHANGE_ME:CHANGE_ME@192.168.222.59:27017/mangroveguard?authSource=admin"
  JWT_SECRET: "CHANGE_ME_long_random_string"
  EMAIL_USER: ""
  EMAIL_PASS: ""
