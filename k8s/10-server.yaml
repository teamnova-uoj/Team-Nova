# Backend API (Express + Socket.io).
#
# replicas MUST stay 1: the server runs an in-process watchdog that raises
# offline alerts and sends emails/SMS, keeps rate-limit counters in memory, and
# Socket.io long-polling needs sticky sessions across replicas. A second
# replica would duplicate alerts and notifications.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mangrove-guard-server
  namespace: webapps-mangrove-guard
  labels:
    app: mangrove-guard-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mangrove-guard-server
  template:
    metadata:
      labels:
        app: mangrove-guard-server
    spec:
      imagePullSecrets:
        - name: github-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user in node:alpine
        runAsGroup: 1000
      containers:
        - name: server
          image: ghcr.io/uoj-lk/mangroveguard/server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: mangrove-guard-config
            - secretRef:
                name: mangrove-guard-secret
          env:
            # Keep V8's heap under the container limit so Node GCs instead of
            # being OOM-killed.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=160"
          # Sized for ~100 users: idle Node + mongoose + socket.io sits around
          # 70-90Mi and a few millicores.
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mangrove-guard-server
  namespace: webapps-mangrove-guard
spec:
  selector:
    app: mangrove-guard-server
  ports:
    - name: http
      port: 5000
      targetPort: http
