name: Build and Push Docker Images

# Builds the server and client images and pushes them to GHCR:
#   ghcr.io/<owner>/<repo>/server
#   ghcr.io/<owner>/<repo>/client
# Pull requests only build (no push) so a broken Dockerfile is caught before merge.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "docker/**"
      - ".github/workflows/docker-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "docker/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            build-args: ""
          - component: client
            # Production is served at https://www.webapps.jfn.ac.lk/mangrove-guard/
            # with the API at /mangrove-guard/api (see k8s/). Both are baked into
            # the React bundle at build time.
            build-args: |
              PUBLIC_URL=/mangrove-guard
              REACT_APP_API_URL=/mangrove-guard/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          platforms: linux/amd64

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.component }} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
